version: 2

project_name: agent-utils

before:
  hooks:
    - go mod tidy

builds:
  - binary: agent-utils
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  # No version in the name, so releases/latest/download/<name> is a stable
  # URL that install instructions and scripts can rely on.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  # A tag like v2.1.0-rc.1 becomes a GitHub pre-release, so it is never what
  # releases/latest (and the install one-liner) points at.
  prerelease: auto

changelog:
  sort: asc
  groups:
    # Listed first so that a breaking change (type!: ...) is never buried
    # among ordinary features and fixes.
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat'
      order: 1
    - title: Fixes
      regexp: '^fix'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"
