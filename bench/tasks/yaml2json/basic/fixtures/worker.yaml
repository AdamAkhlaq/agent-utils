# Worker service
service: thumbnailer
image: registry.example/thumbnailer:2.7.1
replicas: 2
resources:
  cpu: 0.5
  memory_mb: 768
queue:
  name: "jobs/1cd38e"
  visibility_timeout: 45
  dead_letter: null
sizes: [64, 128, 512]
formats:
  - webp
  - avif
  - "jpeg"
enabled: true
debug: false
description: >
  Builds thumbnails for uploaded photos
  and stores them next to the original.
startup_script: |
  set -e
  mkdir -p /tmp/thumbs
  exec thumbnailer --queue "$QUEUE"
owner: 'Hana Novák'
retry_policy: {attempts: 4, delay_ms: 250, jitter: true}
